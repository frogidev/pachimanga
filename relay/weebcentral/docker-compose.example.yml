services:
  weebcentral-relay:
    image: ghcr.io/frogidev/pachimanga-weebcentral-relay:latest
    container_name: pachimanga-weebcentral-relay
    restart: unless-stopped
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
