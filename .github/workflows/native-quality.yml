name: Native Quality

on:
  pull_request:
    paths:
      - ".github/workflows/native-quality.yml"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/ios-release.yml"
      - "scripts/**"
      - "src-tauri/**"
      - "src/lib/native/**"
      - "src/features/native/**"
      - "src/features/reader/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-quality.yml"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/ios-release.yml"
      - "scripts/**"
      - "src-tauri/**"
      - "src/lib/native/**"
      - "src/features/native/**"
      - "src/features/reader/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Prepare Tauri icon fixture
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          cp public/icons/icon-512.png src-tauri/icons/icon.png

      - name: Check Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Check version consistency
        run: node scripts/check-native-version.mjs
