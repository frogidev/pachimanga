name: Web Quality

on:
  pull_request:
    paths:
      - ".github/workflows/web-quality.yml"
      - "src/**"
      - "public/**"
      - "tests/**"
      - "next.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-quality.yml"
      - "src/**"
      - "public/**"
      - "tests/**"
      - "next.config.*"
      - "tsconfig.json"
      - "eslint.config.*"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
