name: Provider Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
  pull_request:
    paths:
      - 'ops/provider-live-smoke.mjs'
      - '.github/workflows/provider-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: provider-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      RELAY_BASE_URL: https://wc-relay.frogilab.dev
      RELAY_TOKEN: ${{ secrets.WEEBCENTRAL_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Provider and relay live smoke
        run: node ops/provider-live-smoke.mjs
