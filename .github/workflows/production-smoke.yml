name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "ops/production-smoke.mjs"

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Anonymous production boundary smoke
        env:
          BASE_URL: https://pachimanga.frogilab.dev
        run: node ops/production-smoke.mjs
