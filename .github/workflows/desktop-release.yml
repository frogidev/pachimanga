      - name: Import Linux signing key
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY"
          test -n "$SIGN_KEY"
          test -n "$APPIMAGETOOL_SIGN_PASSPHRASE"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.11" --locked

      - name: Generate native icons
        run: cargo tauri icon public/icons/icon-512.png

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Windows signing secrets are required for release builds.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'pachimanga-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5
          $config | Set-Content -Path src-tauri/tauri.release.windows.json -Encoding utf8

